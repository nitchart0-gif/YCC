# YouTube Video Script Writer - starting point
# Copy this file, replace every placeholder with your own value, keep the field names.
# The word-budget helper reads video.target_minutes and video.words_per_minute.
video:
  channel: <channel name>
  topic: <one topic>
  audience: <who it is for>
  target_minutes: <number>
  words_per_minute: <number>
  primary_action: <watch to the end | subscribe | visit url>
  hook_deadline_seconds: <number>
  beats:
    - timecode: <00:00>
      line: <what is said>
      b_roll: <what the viewer sees>
      source: <any claim that needs a source>
  links:
    - <url and what it is>
  disclosure: <sponsor or affiliate line, or none>
  rights_notes:
    - <music, footage and licences>
  title_options:
    - <under 100 characters>
  thumbnail_text: <a few words>
